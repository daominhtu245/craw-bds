[project]
name = "expat-lead-radar-collectors"
version = "1.0.0"
description = "Read-only collectors for Expat Lead Radar (Telegram, Facebook via Apify or own browser session, Expat.com forum)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.28,<1",
    "telethon>=1.45,<2",
    "apify-client>=3.4,<4",
    "selectolax>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
# Facebook via your own logged-in browser (facebook.session / facebook.browser).
# After install: python -m playwright install chromium
browser = ["playwright>=1.48,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "telegram", "facebook", "forum", "reddit", "threads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
