# Expat Lead Radar — single-host stack (SPEC 3, Phase 1).
# All services read secrets from ./.env (copy .env.example first).

x-app: &app
  build:
    context: ./app
  image: expat-lead-radar-app:local
  env_file: .env
  environment: &app-env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    REDIS_HOST: redis
    REDIS_CLIENT: phpredis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    LOG_CHANNEL: json
    PHP_OPCACHE_ENABLE: "1"
    # Code is baked into the image; restart containers after rebuilding.
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      # Never cache config: a cached config would make `php artisan test`
      # ignore phpunit.xml and run RefreshDatabase against the real MySQL.
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_OPTIMIZE: "false"

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 15s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 15s

  # ---------------------------------------------------------------- collectors
  # `docker compose run --rm collectors pytest`
  collectors:
    build:
      context: ./collectors
    image: expat-lead-radar-collectors:local
    profiles: ["tools"]
    env_file: .env
    command: ["python", "-m", "pytest", "-q"]

  collector-telegram:
    image: expat-lead-radar-collectors:local
    build:
      context: ./collectors
    env_file: .env
    environment:
      SPOOL_DIR: /data/spool/telegram
    command: ["python", "-m", "telegram.listener"]
    volumes:
      - ./data:/data
    depends_on:
      - app
    restart: unless-stopped

  collector-facebook:
    image: expat-lead-radar-collectors:local
    build:
      context: ./collectors
    env_file: .env
    environment:
      SPOOL_DIR: /data/spool/facebook
    command: ["python", "-m", "facebook.run"]
    volumes:
      - ./data:/data
    depends_on:
      - app
    restart: unless-stopped

  collector-forum:
    image: expat-lead-radar-collectors:local
    build:
      context: ./collectors
    env_file: .env
    environment:
      SPOOL_DIR: /data/spool/forum
    command: ["python", "-m", "forum.expat_com"]
    volumes:
      - ./data:/data
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-leadradar}
      MYSQL_USER: ${DB_USERNAME:-leadradar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF so queued jobs survive a restart (SPEC 17).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
